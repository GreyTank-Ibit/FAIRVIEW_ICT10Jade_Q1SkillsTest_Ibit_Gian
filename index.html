<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1 Practice 3</title>

    <link rel="stylesheet" href="https://pyscript.net/releases/2025.3.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2025.3.1/core.js"></script>

    <!--
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    -->

    <style>
        html, body, header, main, footer, form, div, h1, label, input, button {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        body {
            background-image: url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQscpfJLn-KFN8IzyDdH-F3GN5g2ZvXeixAOm3xnOwvFwDokYqPxBuMde93&s=10");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            width: 100%;
            text-align: center;
            padding: 20px 10px;
            background-color: rgba(255, 217, 59, 0.9); /* yellow */
        }

        header h1 {
            margin: 0;
            color: #000000;
            font-size: 2em;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            width: 100%;
            padding: 30px 15px;
        }

        form {
            background-color: rgba(255, 255, 255, 0.92);
            border: 4px solid #FF8C00; /* orange */
            border-radius: 12px;
            padding: 25px 35px;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        input[type="text"] {
            width: 80%;
            padding: 8px;
            margin: 6px 0;
            border: 2px solid #FFD93B;
            border-radius: 6px;
        }

        label {
            color: #B22222;
            font-weight: bold;
        }

        button {
            background-color: #FF8C00;
            color: white;
            border: none;
            padding: 10px 18px;
            margin: 8px 4px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        #output1, #output2, #output3, #output4 {
            color: #B22222;
            font-weight: bold;
            margin-top: 6px;
        }

        footer {
            width: 100%;
            text-align: center;
            padding: 14px 10px;
            background-color: rgba(255, 140, 0, 0.85); /* orange */
            color: #ffffff;
            font-weight: bold;
        }
    </style>

</head>
<body>

    <header>
        <h1>Ibit's Burger Shack! Receipt</h1>
    </header>

    <main>
        <form>
            <input type="text" id="input1" placeholder="Enter Customer Name">
            <br>
            <input type="text" id="input2" placeholder="Enter Requested Items">
            <br>
            <button type="button" py-click="confirm_info">Confirm Information</button>
            <br>
            <br>
            <label for="choose">Choose:</label>
            <br>
            <input type="checkbox" id="item1" value="120">
            <label for="item1">Classic Cheeseburger</label>
            <br>
            <input type="checkbox" id="item2" value="150">
            <label for="item2">Double Patty Cheeseburger</label>
            <br>
            <input type="checkbox" id="item3" value="180">
            <label for="item3">Large Cheeseburger</label>
            <br>
            <input type="checkbox" id="item4" value="50">
            <label for="item4">Fries</label>
            <br>
            <input type="checkbox" id="item5" value="60">
            <label for="item5">Cheesy Fries</label>
            <br>
            <br>
            <label for="choose">Chosen Extra Items / Requests:</label>
            <br>
            <input type="radio" id="regular" name="size" value="0">
            <label for="regular">Regular(+Php 0)</label>
            <br>
            <input type="radio" id="upsize" name="size" value="30">
            <label for="upsize">Extra Cheese(+Php 30)</label>
            <br>
            <input type="radio" id="extra_ketchup" name="size" value="30">
            <label for="extra_ketchup">Extra Ketchup(+Php 30)</label>
            <br>
            <input type="radio" id="w/o_Veggies" name="size" value="30">
            <label for="w/o_Veggies">Without Veggies(-Php 30)</label>
            <br>
            <br>
            <button type="button" py-click="create_order">Create Order</button>
            <br>
            <br>
            <button type="button" py-click="show_order">Show Order</button>
        </form>
    </main>

    <div id="output1"></div>
    <div id="output2"></div>
    <div id="output3"></div>
    <div id="output4"></div>

    <footer>
        @FV_Burge_Skills_Test | made by Gian Ibit | 2026
    </footer>

    <script type="py" src="main.py"></script>

</body>
</html>
