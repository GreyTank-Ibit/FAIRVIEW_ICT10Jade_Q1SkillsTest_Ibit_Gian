<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1 Practice 3</title>

    <link rel="stylesheet" href="https://pyscript.net/releases/2025.3.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2025.3.1/core.js"></script>

    <!--
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />

    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    --> 

</head>
<body>
        <h1>Ibit's Burger Shack! Receipt</h1>
    <br>
    <form>
        <input type="text" id="input1" placeholder="Enter Customer Name">
        <br>
        <input type="text" id="input2" placeholder="Enter Requested Items">
        <br>
        <button type="button" py-click="confirm_info">Confirm Information</button>
        <br>
        <br>
        <label for="choose">Choose:</label>
        <br>
        <input type="checkbox" id="item1" value="120">
        <label for="item1">Classic Cheeseburger</label>
        <br>
        <input type="checkbox" id="item2" value="150">
        <label for="item2">Double Patty Cheeseburger</label>
        <br>
        <input type="checkbox" id="item3" value="180">
        <label for="item3">Large Cheeseburger</label>
        <br>
        <input type="checkbox" id="item4" value="50" placeholder="Fries>
        <label for="item4">Fries</label>
        <br>
        <input type="checkbox" id="item5" value="60" placeholder="Cheesy Fries">
        <label for="item5">Cheesy Fries</label>
        <br>
        <br>
        <label for="choose">Chosen Extra Items / Requests:</label>
        <br>
        <input type="radio" id="regular" name="size" value="0">
        <label for="regular">Regular(+Php 0)</label>
        <br>
        <input type="radio" id="upsize" name="size" value="30">
        <label for="upsize">Extra Cheese(+Php 30)</label>
        <br>
        <input type="radio" id="extra_ketchup" name="size" value="30">
        <label for="extra_ketchup">Extra Ketchup(+Php 30)</label>
        <br>
        <input type="radio" id="w/o_Veggies" name="size" value="30">
        <label for="w/o_Veggies">Without Veggies(-Php 30)</label>
        <br>
        <br>
        <button type="button" py-click="create_order">Create Order</button>
        <br>
        <br>
        <button type="button" py-click="show_order">Show Order</button>


    </form>

    <div id="output1"></div>
    <div id="output2"></div>
    <div id="output3"></div>
    <div id="output4"></div>
        <script type="py" src="main.py"></script>

    
</body>
</html>
