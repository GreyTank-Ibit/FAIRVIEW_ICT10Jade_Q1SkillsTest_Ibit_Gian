<body>
    <h1>PY-Numbers</h1>
    <br>
    <form>
        <input type="text" id="input1" placeholder="Enter a Number">

        <input type="text" id="input2" placeholder="Enter another Number">
        <br>
        <br>
        <label for="choose">Choose:</label>
        <br>
        <input type="checkbox" id="item1" value="120">
        <label for="item1">Americano</label>
        <br>
        <br>
        <label for="choose">Choose:</label>
        <br>
        <input type="radio" id="regular" name="size" value="0">
        <label for="regular">Regular(+Php 0)</label>
        <br>
        <input type="radio" id="upsize" name="size" value="30">
        <label for="upsize">Upsize(+Php 30)</label>
        <br>
        <br>
        <button type="button" py-click="create_order">Create Order</button>

        <br>
        <select id="coffee">
            <option value="0">Choose a coffee</option>
            <option value="120">Americano</option>
            <option value="150">Cappuccino</option>
            <option value="180">Latte</option>
        </select>
        <button type="button" py-click="place_order">Place Order</button>
        <br>

        <br>
        <button type="button" py-click="show_order">Show Order</button>


    </form>
